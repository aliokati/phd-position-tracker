name: Gather funded PhD positions

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */3 * * *"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: phd-tracker
  cancel-in-progress: false

jobs:
  gather:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Gather public position metadata
        run: python automation/cloud_gatherer.py
      - name: Build Pages dashboard
        run: python automation/build_dashboard.py
      - name: Commit updated tracker
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/positions.json docs/index.html
          git diff --cached --quiet || git commit -m "Update PhD position tracker"
          git push

  deploy:
    needs: gather
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
